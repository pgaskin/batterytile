name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const gradle = fs.readFileSync('app/build.gradle', 'utf8')
            const versionName = gradle.match(/^\s*versionName\s+['"]([^'"]+)['"]/m)?.[1]
            const versionCode = gradle.match(/^\s*versionCode\s+([0-9]+)/m)?.[1]
            if (!versionName) throw new Error('missing versionName in app/build.gradle')
            if (!versionCode) throw new Error('missing versionCode in app/build.gradle')
            const tag = context.ref.replace(/^refs\/tags\//, '')
            if (versionName !== versionCode) throw new Error(`versionName (${versionName}) does not match versionCode (${versionCode})`)
            if (tag !== `v${versionName}`) throw new Error(`tag (${tag}) does not match versionName (${versionName})`)
            if (tag !== `v${versionCode}`) throw new Error(`tag (${tag}) does not match versionCode (${versionCode})`)
            if (!fs.existsSync(`metadata/en-US/changelogs/${versionCode}.txt`)) throw new Error(`missing changelog for versionCode ${versionCode}`)
            core.setOutput('name', versionName)
            core.setOutput('code', versionCode)
            core.setOutput('tag', tag)

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses; ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager 'build-tools;36.0.0'
      - run: ./gradlew app:assembleRelease

      - name: Write keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Sign APK
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner sign --ks "$KEYSTORE_PATH" --ks-pass env:KEYSTORE_PASSWORD --in app/build/outputs/apk/release/app-release-unsigned.apk --out app-release.apk
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app-release.apk

      - name: Verify reproducible build
        # based on what claude did for cmus-android
        run: |
          set -euo pipefail
          rebuild=/tmp/batterytile-rebuild-at-a-different-path
          rsync -a --delete \
            --exclude='/build/' --exclude='/app/build/' \
            --exclude='.gradle/' --exclude='.cxx/' \
            ./ "$rebuild/"
          ( cd "$rebuild" && ./gradlew --no-daemon app:assembleRelease )
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          rebuilt="$rebuild/app/build/outputs/apk/release/app-release-unsigned.apk"
          curl -sLo /tmp/check-reproducible.go https://github.com/pgaskin/cmus-android/raw/4bd7e4dda221961e14c215c9e415a43f47215702/notes/check-reproducible.go
          go run /tmp/check-reproducible.go "$unsigned" "$rebuilt"
          go run /tmp/check-reproducible.go app-release.apk "$rebuilt"

      - name: Create release
        id: create-release
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const {data: {id: id}} = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace(/^refs\/tags\//, ''),
              target_commitish: context.sha,
              name: context.ref.replace(/^refs\/tags\//, ''),
              draft: true,
            })
            core.setOutput('id', id)
      - name: Upload release asset
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ toJSON(steps.create-release.outputs.id) }},
              data: require('fs').readFileSync('app-release.apk'),
              name: 'BatteryTile.apk',
            })
